<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NovaShop</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#050912;
  --bg2:#09111f;
  --card:#0d1728;
  --card2:#111d31;
  --text:#f5f7fb;
  --muted:#94a3b8;
  --blue:#3b82f6;
  --blue2:#2563eb;
  --green:#22c55e;
  --red:#ef4444;
  --border:#1e293b;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,select{font:inherit}
button{cursor:pointer}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(5,9,18,.95);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}

.nav{
  max-width:1400px;
  min-height:74px;
  margin:auto;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
  white-space:nowrap;
}

.logo span{color:var(--blue)}

.search{flex:1}

.search input{
  width:100%;
  padding:13px 16px;
  background:#0b1423;
  color:white;
  border:1px solid #263449;
  border-radius:13px;
  outline:none;
}

.search input:focus{border-color:var(--blue)}

.nav-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.icon-btn{
  border:1px solid var(--border);
  background:#0b1423;
  color:white;
  border-radius:12px;
  padding:11px 13px;
}

.icon-btn:hover{background:#132039}

.hero{
  max-width:1400px;
  margin:24px auto 0;
  padding:0 20px;
}

.hero-box{
  background:
    radial-gradient(circle at 80% 20%,rgba(37,99,235,.3),transparent 35%),
    linear-gradient(135deg,#0d1b31,#07101d);
  border:1px solid var(--border);
  border-radius:24px;
  padding:45px;
}

.hero h1{
  font-size:clamp(34px,5vw,65px);
  line-height:1;
  margin-bottom:14px;
}

.hero h1 span{color:var(--blue)}

.hero p{
  color:var(--muted);
  max-width:650px;
  font-size:17px;
  line-height:1.6;
}

.hero-actions{
  display:flex;
  gap:10px;
  margin-top:25px;
  flex-wrap:wrap;
}

.primary,.secondary,.danger{
  border-radius:12px;
  padding:12px 18px;
  font-weight:800;
}

.primary{
  background:var(--blue);
  color:white;
  border:0;
}

.primary:hover{background:var(--blue2)}

.secondary{
  background:#17243a;
  color:white;
  border:1px solid #2a3b55;
}

.secondary:hover{background:#20314d}

.danger{
  background:var(--red);
  color:white;
  border:0;
}

.layout{
  max-width:1400px;
  margin:25px auto;
  padding:0 20px;
}

.toolbar{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
}

.cat{
  white-space:nowrap;
  background:#0b1423;
  color:#cbd5e1;
  border:1px solid var(--border);
  border-radius:999px;
  padding:9px 14px;
}

.cat.active,.cat:hover{
  background:var(--blue2);
  color:white;
  border-color:var(--blue2);
}

select{
  background:#0b1423;
  color:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 13px;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px;
}

.card{
  background:linear-gradient(180deg,#101a2c,#0b1423);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  transition:.2s;
  position:relative;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#31527d;
}

.card-img{
  height:235px;
  background:#080f1b;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  cursor:pointer;
}

.card-img img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.card-body{padding:15px}

.badge{
  display:inline-block;
  background:#16a34a;
  color:white;
  font-size:11px;
  padding:4px 7px;
  border-radius:6px;
  font-weight:800;
  margin-bottom:8px;
}

.card h3{
  font-size:16px;
  line-height:1.35;
  min-height:44px;
}

.category{
  color:#64748b;
  font-size:12px;
  margin-top:7px;
}

.price{
  margin-top:12px;
  font-size:21px;
  font-weight:900;
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.card-actions button{
  flex:1;
  padding:10px;
  border-radius:9px;
  border:1px solid var(--border);
}

.buy{
  background:var(--blue2);
  color:white;
  border:0!important;
}

.fav{
  max-width:45px;
  background:#111c2d;
  color:white;
}

.fav.active{color:#ef4444}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:var(--muted);
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.overlay.open{display:flex}

.modal{
  width:min(1000px,100%);
  max-height:90vh;
  overflow:auto;
  background:#0b1423;
  border:1px solid #263449;
  border-radius:20px;
  padding:22px;
  position:relative;
}

.close{
  position:absolute;
  right:15px;
  top:13px;
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:#17243a;
  color:white;
  font-size:20px;
  z-index:5;
}

.modal h2{margin-bottom:18px}

.product-detail{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

.product-detail-image{
  width:100%;
  height:420px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:18px;
  background:#111827;
}

.product-detail-image img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  max-width:100%;
  max-height:100%;
}

.detail-info h1{
  font-size:30px;
  line-height:1.15;
  margin-bottom:10px;
}

.detail-info .price{font-size:30px}

.detail-info p{
  color:var(--muted);
  line-height:1.6;
  margin:15px 0;
}

.form{
  display:grid;
  gap:12px;
}

.form input{
  width:100%;
  padding:13px;
  background:#07101d;
  border:1px solid #263449;
  border-radius:10px;
  color:white;
  outline:none;
}

.form input:focus{border-color:var(--blue)}

.cart-item{
  display:flex;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid var(--border);
}

.cart-item img{
  width:75px;
  height:75px;
  object-fit:contain;
  background:#111827;
  border-radius:10px;
}

.cart-info{flex:1}

.cart-info h3{font-size:15px}

.qty{
  display:flex;
  gap:7px;
  align-items:center;
  margin-top:9px;
}

.qty button{
  width:30px;
  height:30px;
  border:1px solid var(--border);
  background:#162236;
  color:white;
  border-radius:6px;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  font-size:21px;
  font-weight:900;
  margin-top:18px;
}

.payment-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

.payment{
  background:#111c2d;
  border:1px solid #293950;
  color:white;
  border-radius:12px;
  padding:17px;
  text-align:left;
}

.payment:hover{border-color:var(--blue)}

.payment.active{
  border-color:var(--blue);
  background:#12284c;
}

.payment-icon{
  font-size:25px;
  margin-bottom:6px;
}

.payment-name{font-weight:900}

.payment-desc{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.payment-panel{
  margin-top:14px;
  padding:15px;
  background:#07101d;
  border:1px solid var(--border);
  border-radius:12px;
}

.payment-panel p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.account-box{
  display:grid;
  gap:12px;
}

.admin-order{
  padding:16px;
  margin:10px 0;
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  background:#0d1728;
}

.admin-order p{margin-top:7px;color:#cbd5e1}

.toast{
  position:fixed;
  bottom:22px;
  right:22px;
  background:#101b2d;
  border:1px solid #30415a;
  color:white;
  padding:14px 18px;
  border-radius:12px;
  z-index:500;
  transform:translateY(100px);
  opacity:0;
  transition:.25s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

footer{
  margin-top:50px;
  padding:35px 20px;
  border-top:1px solid var(--border);
  text-align:center;
  color:#64748b;
}

@media(max-width:1050px){
  .products{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:750px){
  .products{grid-template-columns:repeat(2,1fr)}
  .product-detail{grid-template-columns:1fr}
  .payment-grid{grid-template-columns:1fr}
  .hero-box{padding:30px 22px}
  .nav{flex-wrap:wrap}
  .search{order:5;flex-basis:100%}
}

@media(max-width:500px){
  .products{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">
      NOVA<span>SHOP</span>
    </div>

    <div class="search">
      <input
        id="search"
        type="search"
        placeholder="Rechercher un produit..."
      >
    </div>

    <div class="nav-buttons">

      <button class="icon-btn" id="accountBtn">
        👤 Compte
      </button>

      <button class="icon-btn" id="favoritesBtn">
        ❤️
      </button>

      <button class="icon-btn" id="cartBtn">
        🛒 <b id="cartBadge">0</b>
      </button>

      <button class="icon-btn" id="adminBtn">
        ⚙️
      </button>

    </div>

  </div>
</header>

<section class="hero">

  <div class="hero-box">

    <h1>
      Bienvenue sur <span>NovaShop</span>
    </h1>

    <p>
      Composants PC, PC Gamer, écrans, claviers, souris,
      casques, bureaux, éclairage RGB et bien plus.
    </p>

    <div class="hero-actions">

      <button class="primary" id="shopBtn">
        🛒 Voir les produits
      </button>

    </div>

  </div>

</section>

<main class="layout" id="shop">

  <div class="toolbar">

    <div class="categories" id="categories"></div>

    <select id="sort">
      <option value="default">Trier</option>
      <option value="priceAsc">Prix croissant</option>
      <option value="priceDesc">Prix décroissant</option>
      <option value="name">Nom A-Z</option>
    </select>

  </div>

  <div class="products" id="products"></div>

</main>

<footer>
  NovaShop © 2026
</footer>

<div class="overlay" id="overlay">

  <div class="modal">

    <button class="close" id="closeModal">
      ×
    </button>

    <div id="modalContent"></div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script type="module" src="./app.js"></script>

</body>
</html>
