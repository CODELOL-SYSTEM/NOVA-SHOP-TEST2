<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050912">
<title>NovaShop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#050912;
  color:#fff;
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(5,9,18,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid #17243a;
}

.nav{
  width:min(1400px,94%);
  margin:auto;
  min-height:76px;
  display:flex;
  align-items:center;
  gap:22px;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:1px;
  white-space:nowrap;
}

.logo span{
  color:#287cff;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  height:46px;
  border:1px solid #223451;
  border-radius:13px;
  background:#0b1423;
  color:#fff;
  outline:none;
  padding:0 17px;
  transition:.2s;
}

.search input:focus{
  border-color:#287cff;
  box-shadow:0 0 0 3px rgba(40,124,255,.12);
}

.nav-buttons{
  display:flex;
  gap:8px;
}

.icon-btn{
  position:relative;
  width:45px;
  height:45px;
  border:1px solid #223451;
  border-radius:12px;
  background:#0b1423;
  color:#fff;
  transition:.2s;
}

.icon-btn:hover{
  transform:translateY(-2px);
  border-color:#287cff;
  background:#101d31;
}

#cartBadge{
  position:absolute;
  right:-5px;
  top:-7px;
  min-width:19px;
  height:19px;
  padding:0 5px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#287cff;
  color:#fff;
  font-size:11px;
}

.hero{
  width:min(1400px,94%);
  margin:30px auto 0;
  min-height:290px;
  border:1px solid #172a48;
  border-radius:25px;
  background:
    radial-gradient(circle at 85% 20%,rgba(40,124,255,.24),transparent 30%),
    radial-gradient(circle at 20% 80%,rgba(70,40,255,.13),transparent 35%),
    linear-gradient(135deg,#091525,#060b15);
  display:flex;
  align-items:center;
  padding:45px;
  overflow:hidden;
}

.hero-content{
  max-width:720px;
}

.hero h1{
  font-size:clamp(35px,5vw,68px);
  line-height:1;
  margin-bottom:17px;
}

.hero h1 span{
  color:#287cff;
}

.hero p{
  color:#9caec7;
  font-size:17px;
  line-height:1.6;
  margin-bottom:25px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.primary,
.secondary{
  border:0;
  padding:13px 20px;
  border-radius:12px;
  font-weight:800;
  transition:.2s;
}

.primary{
  background:#287cff;
  color:#fff;
}

.primary:hover{
  background:#4c92ff;
  transform:translateY(-2px);
}

.secondary{
  background:#101c2d;
  border:1px solid #263a59;
  color:#fff;
}

.secondary:hover{
  border-color:#287cff;
  transform:translateY(-2px);
}

.layout{
  width:min(1400px,94%);
  margin:32px auto 80px;
}

.toolbar{
  display:flex;
  gap:15px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.categories{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.category-btn{
  border:1px solid #21344f;
  background:#0a1321;
  color:#a9bad1;
  padding:9px 13px;
  border-radius:10px;
  transition:.2s;
}

.category-btn:hover,
.category-btn.active{
  background:#287cff;
  color:#fff;
  border-color:#287cff;
}

#sort{
  min-width:180px;
  height:40px;
  border-radius:10px;
  border:1px solid #21344f;
  background:#0a1321;
  color:#fff;
  padding:0 10px;
  outline:none;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:17px;
}

.product-card{
  position:relative;
  background:#0b1422;
  border:1px solid #172943;
  border-radius:17px;
  overflow:hidden;
  transition:.25s;
}

.product-card:hover{
  transform:translateY(-5px);
  border-color:#287cff;
  box-shadow:0 14px 40px rgba(0,0,0,.25);
}

.product-image{
  height:230px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.product-info{
  padding:15px;
}

.product-category{
  color:#6e9ee8;
  font-size:12px;
  margin-bottom:7px;
  font-weight:700;
}

.product-name{
  min-height:44px;
  font-size:15px;
  line-height:1.4;
  font-weight:700;
}

.product-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:14px;
}

.price{
  color:#fff;
  font-size:18px;
  font-weight:900;
}

.card-actions{
  display:flex;
  gap:7px;
}

.small-btn{
  border:1px solid #263b5b;
  background:#101b2b;
  color:#fff;
  border-radius:9px;
  min-width:36px;
  height:36px;
  padding:0 9px;
}

.small-btn:hover{
  border-color:#287cff;
}

.add-btn{
  background:#287cff;
  border-color:#287cff;
}

.favorite.active{
  color:#ff4f78;
  border-color:#ff4f78;
}

.new-badge{
  position:absolute;
  left:12px;
  top:12px;
  background:#287cff;
  padding:6px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:900;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(7px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.overlay.show{
  display:flex;
}

.modal{
  width:min(850px,100%);
  max-height:90vh;
  overflow:auto;
  position:relative;
  background:#091321;
  border:1px solid #223754;
  border-radius:20px;
  box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.close{
  position:absolute;
  z-index:5;
  right:13px;
  top:13px;
  width:38px;
  height:38px;
  border:1px solid #293e5c;
  border-radius:10px;
  background:#0d1929;
  color:#fff;
  font-size:25px;
}

.close:hover{
  background:#17263b;
}

.modal-inner{
  padding:28px;
}

.modal-title{
  font-size:25px;
  margin-bottom:18px;
}

.product-detail{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

.detail-image{
  min-height:380px;
  border-radius:15px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.detail-image img{
  width:100%;
  height:100%;
  max-height:390px;
  object-fit:contain;
}

.detail-category{
  color:#5995f3;
  font-weight:700;
  margin-bottom:10px;
}

.detail-name{
  font-size:28px;
  line-height:1.15;
  margin-bottom:16px;
}

.detail-price{
  font-size:29px;
  font-weight:900;
  margin-bottom:22px;
}

.detail-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.qty-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:18px 0;
}

.qty-btn{
  width:38px;
  height:38px;
  border:1px solid #29405f;
  background:#101c2c;
  color:#fff;
  border-radius:9px;
}

.qty-value{
  min-width:30px;
  text-align:center;
  font-weight:800;
}

.cart-item{
  display:grid;
  grid-template-columns:70px 1fr auto;
  gap:12px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #182940;
}

.cart-item img{
  width:70px;
  height:70px;
  background:#fff;
  border-radius:9px;
  object-fit:contain;
  padding:5px;
}

.cart-item-name{
  font-weight:700;
  line-height:1.35;
}

.cart-item-price{
  color:#82aff5;
  margin-top:5px;
  font-size:13px;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:6px;
}

.cart-controls button{
  width:31px;
  height:31px;
  border:1px solid #293d59;
  background:#101c2c;
  color:#fff;
  border-radius:7px;
}

.total-box{
  margin-top:20px;
  border:1px solid #213653;
  border-radius:13px;
  padding:17px;
  background:#0c1727;
}

.total-line{
  display:flex;
  justify-content:space-between;
  margin:7px 0;
}

.total-line.final{
  border-top:1px solid #263b58;
  margin-top:13px;
  padding-top:13px;
  font-size:20px;
  font-weight:900;
}

.form{
  display:grid;
  gap:12px;
}

.form input{
  width:100%;
  height:46px;
  border:1px solid #263b59;
  border-radius:10px;
  background:#0b1625;
  color:#fff;
  padding:0 13px;
  outline:none;
}

.form input:focus{
  border-color:#287cff;
}

.payment-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

.payment-card{
  border:1px solid #243a59;
  background:#0c1727;
  border-radius:14px;
  padding:17px;
}

.payment-card.active{
  border-color:#287cff;
  box-shadow:0 0 0 2px rgba(40,124,255,.1);
}

.payment-icon{
  font-size:28px;
  margin-bottom:8px;
}

.payment-title{
  font-weight:900;
  font-size:17px;
}

.payment-text{
  color:#8fa2bd;
  font-size:13px;
  line-height:1.5;
  margin-top:6px;
}

.card-fields{
  display:none;
  margin-top:17px;
}

.card-fields.show{
  display:grid;
  gap:12px;
}

.exp-cvv{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.paypal-box{
  display:none;
  margin-top:17px;
}

.paypal-box.show{
  display:block;
}

.error{
  color:#ff657d;
  font-size:13px;
  font-weight:700;
}

.success{
  color:#4ee58a;
  font-size:13px;
  font-weight:700;
}

.account-box{
  padding:28px;
}

.account-email{
  color:#8fa5c2;
  margin:8px 0 20px;
}

.order-card{
  border:1px solid #203650;
  background:#0c1727;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
}

.order-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.status{
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:900;
}

.status.pending{
  background:#493d16;
  color:#ffd75a;
}

.status.paid{
  background:#143e28;
  color:#62ed9c;
}

.status.cancelled{
  background:#461923;
  color:#ff6e84;
}

.admin-table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

.admin-table th,
.admin-table td{
  border-bottom:1px solid #20334c;
  padding:11px 7px;
  text-align:left;
  font-size:13px;
}

.admin-table th{
  color:#77a5eb;
}

.empty{
  padding:45px 20px;
  text-align:center;
  color:#8094af;
}

.toast{
  position:fixed;
  z-index:999;
  right:20px;
  bottom:20px;
  background:#0d192a;
  border:1px solid #29405f;
  color:#fff;
  border-radius:12px;
  padding:13px 17px;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
  transform:translateY(120px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.hidden{
  display:none!important;
}

.auth-tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.auth-tab{
  flex:1;
  height:42px;
  border:1px solid #263b59;
  background:#0d1828;
  color:#fff;
  border-radius:9px;
}

.auth-tab.active{
  background:#287cff;
  border-color:#287cff;
}

@media(max-width:1100px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:800px){
  .nav{
    flex-wrap:wrap;
    padding:13px 0;
  }

  .logo{
    order:1;
  }

  .nav-buttons{
    order:2;
    margin-left:auto;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .hero{
    padding:30px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .product-detail{
    grid-template-columns:1fr;
  }

  .payment-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:520px){
  .products{
    grid-template-columns:1fr;
  }

  .toolbar{
    align-items:stretch;
    flex-direction:column;
  }

  #sort{
    width:100%;
  }

  .hero{
    min-height:250px;
    padding:25px;
  }

  .hero p{
    font-size:15px;
  }

  .modal-inner,
  .account-box{
    padding:20px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">
      NOVA<span>SHOP</span>
    </div>

    <div class="search">
      <input
        id="search"
        type="search"
        placeholder="Rechercher un produit..."
        autocomplete="off"
      >
    </div>

    <div class="nav-buttons">
      <button class="icon-btn" id="accountBtn" title="Compte">👤</button>
      <button class="icon-btn" id="favoritesBtn" title="Favoris">❤️</button>
      <button class="icon-btn" id="dashboardBtn" title="Dashboard">⚙️</button>
      <button class="icon-btn" id="cartBtn" title="Panier">
        🛒
        <b id="cartBadge">0</b>
      </button>
    </div>

  </div>
</header>

<section class="hero">

  <div class="hero-content">

    <h1>
      Bienvenue sur <span>NovaShop</span>
    </h1>

    <p>
      Composants PC, périphériques, écrans, bureaux et accessoires gaming.
      Trouve ton matériel et commande directement depuis NovaShop.
    </p>

    <div class="hero-buttons">
      <button class="primary" id="shopBtn">
        🛒 Voir les produits
      </button>

      <button class="secondary" id="heroDashboardBtn">
        ⚙️ Dashboard
      </button>
    </div>

  </div>

</section>

<main class="layout" id="shop">

  <div class="toolbar">

    <div class="categories" id="categories"></div>

    <select id="sort">
      <option value="default">Trier</option>
      <option value="priceAsc">Prix croissant</option>
      <option value="priceDesc">Prix décroissant</option>
      <option value="name">Nom A-Z</option>
    </select>

  </div>

  <div class="products" id="products"></div>

</main>

<div class="overlay" id="overlay">

  <div class="modal">

    <button class="close" id="closeModal">
      ×
    </button>

    <div id="modalContent"></div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script type="module" src="./app.js"></script>

</body>
</html>
