<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaShop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050912;
  --bg2:#09111f;
  --card:#0c1525;
  --card2:#101c30;
  --border:#1b2b46;
  --text:#f5f7fb;
  --muted:#8e9bb0;
  --blue:#247cff;
  --blue2:#00b7ff;
  --green:#25d366;
  --red:#ff405c;
  --yellow:#ffd43b;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 20% 0%,#102d5d 0,transparent 35%),
    radial-gradient(circle at 80% 10%,#10203e 0,transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(5,9,18,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.nav{
  max-width:1400px;
  margin:auto;
  min-height:76px;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:25px;
  font-weight:1000;
  letter-spacing:-1px;
  background:linear-gradient(90deg,#fff,#36a3ff);
  -webkit-background-clip:text;
  color:transparent;
  white-space:nowrap;
}

.search{
  flex:1;
  max-width:600px;
  margin:auto;
}

.search input{
  width:100%;
  background:#0a1424;
  border:1px solid var(--border);
  color:white;
  border-radius:13px;
  padding:13px 16px;
  outline:none;
}

.search input:focus{
  border-color:var(--blue);
}

.nav-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  background:#0b1628;
  border:1px solid var(--border);
  color:white;
  border-radius:12px;
  padding:11px 13px;
  transition:.2s;
}

.icon-btn:hover{
  border-color:var(--blue);
  transform:translateY(-1px);
}

main{
  max-width:1400px;
  margin:auto;
  padding:25px 20px 60px;
}

.hero{
  min-height:300px;
  border:1px solid var(--border);
  border-radius:25px;
  padding:45px;
  display:flex;
  align-items:center;
  background:
    linear-gradient(135deg,rgba(36,124,255,.18),rgba(0,183,255,.04)),
    #091321;
  overflow:hidden;
  position:relative;
}

.hero:after{
  content:"";
  position:absolute;
  width:400px;
  height:400px;
  border-radius:50%;
  background:#1674ff22;
  filter:blur(40px);
  right:-100px;
  top:-100px;
}

.hero-content{
  position:relative;
  z-index:2;
}

.hero h1{
  font-size:clamp(38px,6vw,72px);
  line-height:.95;
  max-width:800px;
  margin-bottom:18px;
}

.hero p{
  color:var(--muted);
  max-width:650px;
  font-size:17px;
  margin-bottom:25px;
}

.primary,
.secondary,
.danger{
  border:0;
  border-radius:11px;
  padding:12px 17px;
  font-weight:800;
  transition:.2s;
}

.primary{
  background:linear-gradient(90deg,var(--blue),var(--blue2));
  color:white;
}

.secondary{
  background:#142238;
  color:white;
  border:1px solid var(--border);
}

.danger{
  background:#471522;
  color:#ff9cab;
  border:1px solid #702438;
}

.primary:hover,
.secondary:hover,
.danger:hover{
  transform:translateY(-2px);
}

.hero-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin:35px 0 18px;
}

.section-title{
  font-size:28px;
  font-weight:950;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

select{
  background:#0c1728;
  color:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px 13px;
  outline:none;
}

.categories{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:5px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category-btn{
  white-space:nowrap;
  background:#0b1525;
  border:1px solid var(--border);
  color:#aebbd0;
  border-radius:999px;
  padding:9px 15px;
}

.category-btn.active{
  color:white;
  background:#1768d8;
  border-color:#2d8aff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:17px;
}

.product{
  background:linear-gradient(180deg,#0d1727,#091321);
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
  transition:.25s;
  position:relative;
}

.product:hover{
  transform:translateY(-5px);
  border-color:#2d6bb5;
  box-shadow:0 15px 35px #0008;
}

.product-image{
  width:100%;
  height:220px;
  object-fit:contain;
  background:#fff;
  display:block;
}

.product-info{
  padding:15px;
}

.product-category{
  font-size:12px;
  color:#65a9ff;
  font-weight:800;
  margin-bottom:6px;
}

.product-name{
  font-weight:800;
  min-height:44px;
  line-height:1.25;
}

.product-price{
  font-size:22px;
  font-weight:950;
  margin:12px 0;
}

.product-actions{
  display:flex;
  gap:8px;
}

.product-actions button{
  flex:1;
}

.favorite{
  position:absolute;
  right:10px;
  top:10px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid #27354b;
  background:#07101ddd;
  color:white;
  z-index:2;
}

.favorite.active{
  color:#ff4d70;
}

.modal-bg{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#000b;
}

.modal-bg.open{
  display:flex;
}

.modal{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:#091321;
  border:1px solid var(--border);
  border-radius:20px;
  padding:25px;
  position:relative;
}

.close{
  position:absolute;
  top:13px;
  right:13px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid var(--border);
  background:#101d30;
  color:white;
}

.form{
  display:grid;
  gap:12px;
  margin-top:18px;
}

.form input{
  width:100%;
  background:#0b1728;
  color:white;
  border:1px solid var(--border);
  padding:13px;
  border-radius:10px;
  outline:none;
}

.form input:focus{
  border-color:var(--blue);
}

.error{
  background:#421520;
  color:#ff9eaa;
  border:1px solid #702536;
  padding:11px;
  border-radius:9px;
}

.success{
  background:#103b27;
  color:#74f2ac;
  border:1px solid #1c7047;
  padding:11px;
  border-radius:9px;
}

.account-box,
.order-box,
.admin-box,
.cart-item,
.checkout-box{
  background:#0d192b;
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
  margin-top:12px;
}

.cart-item{
  display:flex;
  align-items:center;
  gap:12px;
}

.cart-item img{
  width:70px;
  height:70px;
  object-fit:contain;
  background:white;
  border-radius:9px;
}

.cart-item-info{
  flex:1;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
}

.qty button{
  width:30px;
  height:30px;
  border:1px solid var(--border);
  background:#122139;
  color:white;
  border-radius:7px;
}

.total{
  font-size:25px;
  font-weight:950;
  margin:18px 0;
}

.payment-choice{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:15px 0;
}

.payment-choice button{
  padding:14px;
  border-radius:12px;
  background:#0d192b;
  color:white;
  border:1px solid var(--border);
}

.payment-choice button.selected{
  border-color:#2b89ff;
  background:#123566;
}

.product-detail{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

.product-detail img{
  width:100%;
  max-height:430px;
  object-fit:contain;
  background:white;
  border-radius:14px;
}

.product-detail h2{
  font-size:30px;
  margin-bottom:10px;
}

.product-detail .price{
  font-size:30px;
  font-weight:950;
  margin:20px 0;
}

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  z-index:1000;
  background:#122139;
  border:1px solid #2a4770;
  color:white;
  padding:13px 18px;
  border-radius:12px;
  opacity:0;
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.empty{
  padding:50px 15px;
  text-align:center;
  color:var(--muted);
  grid-column:1/-1;
}

.admin-stat{
  font-size:27px;
  font-weight:950;
  margin-top:7px;
}

.order-status{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#123c29;
  color:#73efa8;
  font-size:12px;
  font-weight:800;
}

.order-status.pending{
  background:#463615;
  color:#ffdc77;
}

@media(max-width:800px){
  .nav{
    flex-wrap:wrap;
  }

  .search{
    order:3;
    flex-basis:100%;
    max-width:none;
  }

  .hero{
    padding:30px 22px;
  }

  .product-detail{
    grid-template-columns:1fr;
  }

  .product-detail img{
    max-height:300px;
  }
}

@media(max-width:550px){
  main{
    padding:15px 12px 40px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .product-image{
    height:155px;
  }

  .product-info{
    padding:10px;
  }

  .product-name{
    font-size:14px;
  }

  .product-price{
    font-size:18px;
  }

  .product-actions{
    flex-direction:column;
  }

  .nav-actions{
    width:100%;
    justify-content:space-between;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">NOVA<span style="color:#2990ff">SHOP</span></div>

    <div class="search">
      <input id="searchInput" type="search" placeholder="🔎 Rechercher un produit...">
    </div>

    <div class="nav-actions">
      <button class="icon-btn" id="accountBtn">👤</button>
      <button class="icon-btn" id="favoritesBtn">❤️</button>
      <button class="icon-btn" id="dashboardBtn">⚙️</button>
      <button class="icon-btn" id="cartBtn">🛒 <span id="cartCount">0</span></button>
    </div>

  </div>
</header>

<main>

  <section class="hero">
    <div class="hero-content">
      <h1>TON SHOP<br>GAMING.</h1>
      <p>
        Composants PC, périphériques, écrans, bureaux, accessoires et PC Gamer.
      </p>

      <div class="hero-buttons">
        <button class="primary" id="productsBtn">Voir les produits</button>
        <button class="secondary" id="heroDashboard">Dashboard</button>
      </div>
    </div>
  </section>

  <div class="section-head">
    <h2 class="section-title">Produits</h2>

    <div class="controls">
      <select id="sortSelect">
        <option value="default">Tri : recommandé</option>
        <option value="priceAsc">Prix croissant</option>
        <option value="priceDesc">Prix décroissant</option>
        <option value="name">Nom A-Z</option>
      </select>
    </div>
  </div>

  <div class="categories" id="categories"></div>

  <section style="margin-top:20px">
    <div class="grid" id="products"></div>
  </section>

</main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="close" id="closeModal">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="./app.js"></script>

</body>
</html>
