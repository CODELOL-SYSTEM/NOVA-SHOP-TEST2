<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050912">
<title>NovaShop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050912;
  --bg2:#09111f;
  --card:#0c1525;
  --card2:#101c30;
  --border:#1b2b44;
  --text:#f5f7fb;
  --muted:#8e9bb0;
  --blue:#4d8dff;
  --blue2:#2869e8;
  --green:#32d583;
  --red:#ff5263;
  --orange:#ff9d42;
  --shadow:0 18px 50px rgba(0,0,0,.35);
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 0%,rgba(43,103,230,.16),transparent 28%),
    radial-gradient(circle at 90% 10%,rgba(0,170,255,.08),transparent 25%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(18px);
  background:rgba(5,9,18,.88);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.nav{
  max-width:1450px;
  margin:auto;
  min-height:74px;
  padding:12px 22px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  min-width:max-content;
  font-size:25px;
  font-weight:1000;
  letter-spacing:1.5px;
  color:white;
}

.logo span{
  color:var(--blue);
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  height:46px;
  padding:0 17px;
  border:1px solid var(--border);
  border-radius:13px;
  outline:none;
  background:#09111f;
  color:white;
  transition:.2s;
}

.search input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(77,141,255,.12);
}

.nav-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.icon-btn{
  height:44px;
  min-width:44px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#0a1322;
  color:white;
  padding:0 12px;
  transition:.2s;
}

.icon-btn:hover{
  border-color:#416da9;
  transform:translateY(-1px);
}

.icon-btn.active{
  border-color:var(--blue);
  background:#10264c;
}

.cart-wrap{
  position:relative;
}

.cart-count{
  position:absolute;
  top:-6px;
  right:-5px;
  min-width:19px;
  height:19px;
  padding:0 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:99px;
  background:var(--red);
  color:white;
  font-size:11px;
  font-weight:900;
}

/* =========================
   HERO
========================= */

.hero{
  max-width:1450px;
  margin:28px auto 0;
  padding:30px 22px 20px;
}

.hero-box{
  position:relative;
  overflow:hidden;
  min-height:290px;
  border:1px solid #1a3357;
  border-radius:25px;
  padding:50px;
  background:
    radial-gradient(circle at 85% 35%,rgba(49,126,255,.3),transparent 25%),
    radial-gradient(circle at 70% 90%,rgba(0,183,255,.12),transparent 28%),
    linear-gradient(135deg,#0a1427,#08101d 65%,#0b1729);
  box-shadow:var(--shadow);
}

.hero-box:before{
  content:"";
  position:absolute;
  width:350px;
  height:350px;
  border-radius:50%;
  right:-130px;
  top:-150px;
  border:1px solid rgba(77,141,255,.18);
  box-shadow:
    0 0 0 45px rgba(77,141,255,.035),
    0 0 0 90px rgba(77,141,255,.025);
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:720px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 11px;
  border:1px solid #24456e;
  border-radius:999px;
  background:#0d1e35;
  color:#8db8ff;
  font-size:12px;
  font-weight:900;
  margin-bottom:16px;
}

.hero h1{
  font-size:clamp(36px,5vw,66px);
  line-height:.98;
  font-weight:1000;
  letter-spacing:-2px;
  margin-bottom:16px;
}

.hero h1 span{
  color:var(--blue);
}

.hero p{
  color:#aab6c9;
  font-size:16px;
  line-height:1.6;
  max-width:600px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:25px;
}

/* =========================
   BUTTONS
========================= */

.primary,
.secondary,
.danger,
.green{
  min-height:44px;
  padding:0 17px;
  border-radius:11px;
  border:1px solid transparent;
  font-weight:900;
  transition:.2s;
}

.primary{
  background:var(--blue);
  color:white;
}

.primary:hover{
  background:#6da1ff;
  transform:translateY(-1px);
}

.secondary{
  background:#0c1728;
  border-color:var(--border);
  color:white;
}

.secondary:hover{
  border-color:#4773af;
  transform:translateY(-1px);
}

.green{
  background:#103d2a;
  border-color:#1d704d;
  color:#76f1b5;
}

.danger{
  background:#3d1018;
  border-color:#71202c;
  color:#ff9baa;
}

.full{
  width:100%;
}

/* =========================
   PRODUCTS AREA
========================= */

.section{
  max-width:1450px;
  margin:auto;
  padding:22px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}

.section-title{
  font-size:26px;
  font-weight:1000;
}

.section-title span{
  color:var(--blue);
}

.controls{
  display:flex;
  gap:9px;
  align-items:center;
}

.controls select{
  height:42px;
  padding:0 12px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#0a1322;
  color:white;
  outline:none;
}

/* =========================
   CATEGORIES
========================= */

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:10px;
  margin-bottom:20px;
  scrollbar-width:thin;
}

.category{
  flex:0 0 auto;
  padding:10px 15px;
  border:1px solid var(--border);
  border-radius:999px;
  background:#0a1322;
  color:#aab6c9;
  font-weight:800;
  font-size:13px;
  transition:.2s;
}

.category:hover{
  color:white;
  border-color:#416da9;
}

.category.active{
  color:white;
  background:#12305c;
  border-color:var(--blue);
}

/* =========================
   PRODUCT GRID
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:17px;
}

.product{
  position:relative;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:18px;
  background:
    linear-gradient(180deg,#0c1728,#09111e);
  box-shadow:0 8px 30px rgba(0,0,0,.18);
  transition:.25s;
}

.product:hover{
  transform:translateY(-5px);
  border-color:#31557f;
  box-shadow:0 18px 45px rgba(0,0,0,.3);
}

.product-image{
  position:relative;
  height:230px;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  overflow:hidden;
}

.product-image img{
  max-width:100%;
  max-height:100%;
  width:100%;
  height:100%;
  object-fit:contain;
  transition:.25s;
}

.product:hover .product-image img{
  transform:scale(1.04);
}

.new-badge{
  position:absolute;
  top:12px;
  left:12px;
  padding:6px 9px;
  border-radius:8px;
  background:#246cff;
  color:white;
  font-size:11px;
  font-weight:1000;
  z-index:3;
}

.favorite{
  position:absolute;
  right:11px;
  top:11px;
  width:38px;
  height:38px;
  border:1px solid rgba(0,0,0,.12);
  border-radius:50%;
  background:rgba(255,255,255,.9);
  font-size:19px;
  z-index:3;
}

.favorite.active{
  color:#ff4662;
}

.product-info{
  padding:17px;
}

.product-category{
  color:#6f9fe9;
  font-size:11px;
  text-transform:uppercase;
  font-weight:1000;
  letter-spacing:.8px;
  margin-bottom:7px;
}

.product-name{
  min-height:47px;
  font-size:15px;
  line-height:1.45;
  font-weight:900;
}

.product-price{
  margin-top:13px;
  font-size:22px;
  font-weight:1000;
}

.product-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.product-actions button{
  min-height:40px;
  border-radius:10px;
}

/* =========================
   MODAL
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:min(850px,100%);
  max-height:92vh;
  overflow-y:auto;
  border:1px solid #233b5e;
  border-radius:22px;
  background:#08111f;
  box-shadow:0 30px 100px rgba(0,0,0,.55);
  position:relative;
}

.close{
  position:absolute;
  top:15px;
  right:15px;
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid var(--border);
  background:#0b1728;
  color:white;
  font-size:20px;
  z-index:10;
}

.modal-content{
  padding:28px;
}

/* =========================
   PRODUCT DETAILS
========================= */

.detail{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

.detail-image{
  min-height:400px;
  border-radius:17px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
}

.detail-image img{
  max-width:100%;
  max-height:420px;
  object-fit:contain;
}

.detail-info{
  padding:10px 5px;
}

.detail-info h2{
  font-size:30px;
  line-height:1.2;
  margin-bottom:12px;
}

.detail-info .price{
  font-size:30px;
  font-weight:1000;
  margin:20px 0;
}

.detail-info p{
  color:#aab6c9;
  line-height:1.65;
}

/* =========================
   FORMS
========================= */

.form{
  display:grid;
  gap:12px;
}

.form label{
  font-size:12px;
  font-weight:900;
  color:#aebbd0;
}

.form input,
.form select{
  width:100%;
  min-height:46px;
  padding:0 13px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#091321;
  color:white;
  outline:none;
}

.form textarea{
  width:100%;
  min-height:100px;
  padding:13px;
  resize:vertical;
  border:1px solid var(--border);
  border-radius:10px;
  background:#091321;
  color:white;
  outline:none;
}

.form input:focus,
.form select:focus,
.form textarea:focus{
  border-color:var(--blue);
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.error{
  color:#ff7b8a;
  font-size:13px;
  margin-top:4px;
}

.success{
  color:#68e7a6;
  font-size:13px;
}

/* =========================
   ACCOUNT
========================= */

.account-box{
  max-width:500px;
  margin:auto;
}

.account-box h2{
  font-size:28px;
  margin-bottom:7px;
}

.account-box p{
  color:var(--muted);
  margin-bottom:20px;
}

.account-switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:20px;
}

/* =========================
   CART
========================= */

.cart-list{
  display:grid;
  gap:10px;
}

.cart-item{
  display:grid;
  grid-template-columns:80px 1fr auto;
  align-items:center;
  gap:14px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:14px;
  background:#0b1626;
}

.cart-item img{
  width:80px;
  height:70px;
  object-fit:contain;
  background:white;
  border-radius:9px;
}

.cart-item-info h3{
  font-size:14px;
  margin-bottom:5px;
}

.cart-item-info p{
  color:#8090a8;
  font-size:12px;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:8px;
}

.qty button{
  width:28px;
  height:28px;
  border:1px solid var(--border);
  border-radius:7px;
  background:#0c1728;
  color:white;
}

.qty span{
  min-width:20px;
  text-align:center;
  font-weight:900;
}

.cart-right{
  text-align:right;
}

.cart-right strong{
  display:block;
  font-size:17px;
  margin-bottom:8px;
}

.remove{
  border:0;
  background:none;
  color:#ff7382;
  font-size:12px;
  font-weight:800;
}

.total{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 0;
  margin-top:15px;
  border-top:1px solid var(--border);
  font-size:22px;
  font-weight:1000;
}

/* =========================
   CHECKOUT
========================= */

.checkout-box{
  display:grid;
  gap:17px;
}

.checkout-title{
  font-size:25px;
  font-weight:1000;
}

.payment-choice{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.payment-option{
  padding:17px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#0a1423;
  color:white;
  text-align:left;
  transition:.2s;
}

.payment-option:hover{
  border-color:#406da8;
}

.payment-option.selected{
  border-color:var(--blue);
  background:#10264a;
}

.payment-option strong{
  display:block;
  margin-bottom:5px;
}

.payment-option small{
  color:#8492a8;
}

.fake-card{
  border:1px solid #233a5b;
  border-radius:17px;
  padding:20px;
  background:
    radial-gradient(circle at 90% 10%,rgba(77,141,255,.2),transparent 30%),
    #0b1728;
}

.fake-card-title{
  font-weight:1000;
  font-size:19px;
  margin-bottom:6px;
}

.fake-card-note{
  color:#8d9bb0;
  font-size:12px;
  line-height:1.5;
  margin-bottom:17px;
}

.paypal-box{
  border:1px solid #263c5d;
  border-radius:17px;
  padding:20px;
  background:#0b1728;
}

.paypal-logo{
  font-size:22px;
  font-weight:1000;
  color:#65a0ff;
}

/* =========================
   ORDERS
========================= */

.order-list{
  display:grid;
  gap:14px;
}

.order-box{
  border:1px solid var(--border);
  border-radius:16px;
  background:#0b1626;
  padding:18px;
}

.order-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
  margin-bottom:15px;
}

.order-id{
  color:#8291a8;
  font-size:11px;
  word-break:break-all;
}

.order-status{
  display:inline-flex;
  padding:7px 10px;
  border-radius:999px;
  background:#122d51;
  color:#8eb9ff;
  font-size:11px;
  font-weight:1000;
}

.order-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.order-field{
  padding:12px;
  border-radius:11px;
  background:#091321;
  border:1px solid #17263c;
}

.order-field small{
  display:block;
  color:#77869d;
  font-size:10px;
  margin-bottom:5px;
  text-transform:uppercase;
  font-weight:900;
}

.order-field strong{
  font-size:13px;
}

.tracking{
  margin-top:14px;
  padding:15px;
  border:1px solid #1b3659;
  border-radius:13px;
  background:#0b1a2d;
}

.tracking-title{
  font-size:12px;
  color:#8298b5;
  font-weight:900;
  margin-bottom:6px;
}

.tracking-location{
  font-size:16px;
  font-weight:1000;
}

.countdown{
  font-size:25px;
  font-weight:1000;
  color:#72a8ff;
}

/* =========================
   ADMIN
========================= */

.admin-box{
  border:1px solid #263f62;
  border-radius:17px;
  padding:18px;
  background:#0a1525;
}

.admin-title{
  font-size:22px;
  font-weight:1000;
  margin-bottom:5px;
}

.admin-subtitle{
  color:#8493a9;
  font-size:13px;
  margin-bottom:18px;
}

.admin-order{
  border:1px solid var(--border);
  border-radius:16px;
  background:#091321;
  padding:17px;
  margin-bottom:12px;
}

.admin-order-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
  margin-bottom:15px;
}

.admin-order-id{
  font-size:12px;
  color:#8291a8;
  word-break:break-all;
}

.admin-fields{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.admin-field{
  display:grid;
  gap:6px;
}

.admin-field label{
  color:#8190a6;
  font-size:10px;
  font-weight:1000;
  text-transform:uppercase;
}

.admin-field input,
.admin-field select{
  min-height:42px;
  width:100%;
  border:1px solid var(--border);
  border-radius:9px;
  padding:0 10px;
  background:#0c1727;
  color:white;
  outline:none;
}

.admin-duration{
  display:grid;
  grid-template-columns:1fr 90px;
  gap:7px;
}

.admin-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:18px;
}

.admin-stat{
  padding:16px;
  border:1px solid var(--border);
  border-radius:14px;
  background:#0b1626;
}

.admin-stat small{
  display:block;
  color:#78879d;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

.admin-stat strong{
  font-size:24px;
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:1000;
  max-width:350px;
  padding:13px 17px;
  border:1px solid #294465;
  border-radius:12px;
  background:#0c192b;
  color:white;
  box-shadow:0 15px 50px rgba(0,0,0,.4);
  opacity:0;
  transform:translateY(20px);
  pointer-events:none;
  transition:.25s;
}

#toast.show{
  opacity:1;
  transform:translateY(0);
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  padding:55px 20px;
  border:1px dashed #263b59;
  border-radius:17px;
  background:#091321;
  color:#8998ad;
}

.empty strong{
  display:block;
  color:white;
  font-size:20px;
  margin-bottom:7px;
}

/* =========================
   FOOTER
========================= */

footer{
  margin-top:50px;
  padding:35px 22px;
  border-top:1px solid rgba(255,255,255,.06);
  background:#040811;
}

.footer-inner{
  max-width:1450px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  gap:20px;
  color:#78879c;
  font-size:12px;
}

.footer-logo{
  font-size:18px;
  font-weight:1000;
  color:white;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1150px){
  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .admin-fields{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:850px){
  .nav{
    flex-wrap:wrap;
  }

  .logo{
    flex:1;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .hero-box{
    padding:35px 25px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .detail{
    grid-template-columns:1fr;
  }

  .detail-image{
    min-height:300px;
  }

  .order-grid{
    grid-template-columns:1fr 1fr;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:580px){
  .nav{
    padding:10px 13px;
  }

  .logo{
    font-size:21px;
  }

  .nav-actions{
    gap:4px;
  }

  .icon-btn{
    padding:0 9px;
    min-width:40px;
  }

  .hero{
    padding:16px 13px;
  }

  .hero-box{
    min-height:330px;
    padding:28px 20px;
    border-radius:19px;
  }

  .hero h1{
    font-size:40px;
  }

  .section{
    padding:16px 13px;
  }

  .section-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .controls{
    width:100%;
  }

  .controls select{
    flex:1;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .product-image{
    height:250px;
  }

  .form-row{
    grid-template-columns:1fr;
  }

  .payment-choice{
    grid-template-columns:1fr;
  }

  .cart-item{
    grid-template-columns:60px 1fr;
  }

  .cart-item img{
    width:60px;
    height:60px;
  }

  .cart-right{
    grid-column:2;
    text-align:left;
  }

  .order-grid{
    grid-template-columns:1fr;
  }

  .admin-fields{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .footer-inner{
    flex-direction:column;
  }

  .modal-bg{
    padding:8px;
  }

  .modal-content{
    padding:20px 15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">
      NOVA<span>SHOP</span>
    </div>

    <div class="search">
      <input
        id="searchInput"
        type="search"
        placeholder="Rechercher un produit..."
        autocomplete="off"
      >
    </div>

    <div class="nav-actions">

      <button
        class="icon-btn"
        id="accountBtn"
        type="button"
        title="Compte"
      >
        👤
      </button>

      <button
        class="icon-btn"
        id="favoritesBtn"
        type="button"
        title="Favoris"
      >
        ❤️
      </button>

      <button
        class="icon-btn"
        id="dashboardBtn"
        type="button"
        title="Dashboard"
      >
        ⚙️
      </button>

      <div class="cart-wrap">
        <button
          class="icon-btn"
          id="cartBtn"
          type="button"
          title="Panier"
        >
          🛒
        </button>
        <span
          class="cart-count"
          id="cartCount"
        >0</span>
      </div>

    </div>
  </div>
</header>


<main>

  <!-- HERO -->

  <section class="hero">

    <div class="hero-box">

      <div class="hero-content">

        <div class="badge">
          ⚡ NOVASHOP
        </div>

        <h1>
          Ton setup.<br>
          <span>Ton univers.</span>
        </h1>

        <p>
          Découvre des composants, PC gamer, écrans, claviers,
          souris, casques, éclairages RGB et accessoires gaming.
        </p>

        <div class="hero-buttons">

          <button
            class="primary"
            id="productsBtn"
            type="button"
          >
            🛒 Voir les produits
          </button>

          <button
            class="secondary"
            id="heroDashboard"
            type="button"
          >
            ⚙️ Dashboard
          </button>

        </div>

      </div>

    </div>

  </section>


  <!-- PRODUCTS -->

  <section
    class="section"
    id="shop"
  >

    <div class="section-head">

      <div>
        <div class="section-title">
          Produits <span>NovaShop</span>
        </div>
      </div>

      <div class="controls">

        <select id="sortSelect">
          <option value="default">
            Trier par défaut
          </option>

          <option value="priceAsc">
            Prix croissant
          </option>

          <option value="priceDesc">
            Prix décroissant
          </option>

          <option value="name">
            Nom A-Z
          </option>
        </select>

      </div>

    </div>


    <div
      class="categories"
      id="categories"
    >
      <!-- Généré par app.js -->
    </div>


    <div
      class="grid"
      id="products"
    >
      <!-- Généré par app.js -->
    </div>

  </section>

</main>


<!-- MODAL -->

<div
  class="modal-bg"
  id="modalBg"
>

  <div
    class="modal"
    role="dialog"
    aria-modal="true"
  >

    <button
      class="close"
      id="closeModal"
      type="button"
      aria-label="Fermer"
    >
      ×
    </button>

    <div
      class="modal-content"
      id="modalContent"
    >
      <!-- Contenu dynamique -->
    </div>

  </div>

</div>


<!-- TOAST -->

<div id="toast"></div>


<footer>

  <div class="footer-inner">

    <div>
      <div class="footer-logo">
        NOVA<span style="color:#4d8dff">SHOP</span>
      </div>

      <div style="margin-top:7px">
        Gaming • PC • Setup • RGB
      </div>
    </div>

    <div style="text-align:right">
      NovaShop © 2026<br>
      Boutique de démonstration
    </div>

  </div>

</footer>


<!-- FIREBASE / NOVASHOP -->

<script type="module" src="./app.js"></script>

</body>
</html>
