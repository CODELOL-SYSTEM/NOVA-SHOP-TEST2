<html lang="fr">

<title>NovaShop</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050912;
  --bg2:#09111f;
  --card:#0d1728;
  --card2:#111d31;
  --text:#f5f7fb;
  --muted:#94a3b8;
  --blue:#3b82f6;
  --blue2:#2563eb;
  --green:#22c55e;
  --red:#ef4444;
  --border:#1e293b;
}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}
button,input,select{font:inherit}
button{cursor:pointer}
header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(5,9,18,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.nav{
  max-width:1400px;
  margin:auto;
  min-height:74px;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:18px;
}
.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
  white-space:nowrap;
}
.logo span{color:#3b82f6}
.search{
  flex:1;
  position:relative;
}
.search input{
  width:100%;
  background:#0b1423;
  color:white;
  border:1px solid #263449;
  border-radius:13px;
  padding:13px 16px;
  outline:none;
}
.search input:focus{border-color:var(--blue)}
.nav-buttons{
  display:flex;
  gap:8px;
}
.icon-btn{
  border:1px solid var(--border);
  background:#0b1423;
  color:white;
  border-radius:12px;
  padding:11px 13px;
}
.icon-btn:hover{background:#132039}
.hero{
  max-width:1400px;
  margin:24px auto 0;
  padding:0 20px;
}
.hero-box{
  background:
    radial-gradient(circle at 80% 20%,rgba(37,99,235,.3),transparent 35%),
    linear-gradient(135deg,#0d1b31,#07101d);
  border:1px solid var(--border);
  border-radius:24px;
  padding:45px;
}
.hero h1{
  font-size:clamp(34px,5vw,65px);
  line-height:1;
  margin-bottom:14px;
}
.hero h1 span{color:#3b82f6}
.hero p{
  color:var(--muted);
  max-width:650px;
  font-size:17px;
  line-height:1.6;
}
.hero-actions{
  display:flex;
  gap:10px;
  margin-top:25px;
  flex-wrap:wrap;
}
.primary,.secondary,.danger{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  font-weight:800;
}
.primary{background:var(--blue);color:white}
.primary:hover{background:var(--blue2)}
.secondary{
  background:#17243a;
  color:white;
  border:1px solid #2a3b55;
}
.danger{background:var(--red);color:white}
.layout{
  max-width:1400px;
  margin:25px auto;
  padding:0 20px;
}
.toolbar{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
}
.cat{
  white-space:nowrap;
  background:#0b1423;
  color:#cbd5e1;
  border:1px solid var(--border);
  border-radius:999px;
  padding:9px 14px;
}
.cat.active,.cat:hover{
  background:#2563eb;
  color:white;
  border-color:#2563eb;
}
select{
  background:#0b1423;
  color:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 13px;
}
.products{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px;
}
.card{
  background:linear-gradient(180deg,#101a2c,#0b1423);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  transition:.2s;
  position:relative;
}
.card:hover{
  transform:translateY(-4px);
  border-color:#31527d;
}
.card-img{
  height:235px;
  background:#080f1b;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.card-img img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
.card-body{padding:15px}
.badge{
  display:inline-block;
  background:#16a34a;
  color:white;
  font-size:11px;
  padding:4px 7px;
  border-radius:6px;
  font-weight:800;
  margin-bottom:8px;
}
.card h3{
  font-size:16px;
  line-height:1.35;
  min-height:44px;
}
.category{
  color:#64748b;
  font-size:12px;
  margin-top:7px;
}
.price{
  margin-top:12px;
  font-size:21px;
  font-weight:900;
}
.card-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}
.card-actions button{
  flex:1;
  padding:10px;
  border-radius:9px;
  border:1px solid var(--border);
}
.buy{background:#2563eb;color:white;border:0!important}
.fav{
  max-width:45px;
  background:#111c2d;
  color:white;
}
.fav.active{color:#ef4444}
.empty{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:var(--muted);
}
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.overlay.open{display:flex}
.modal{
  width:min(900px,100%);
  max-height:90vh;
  overflow:auto;
  background:#0b1423;
  border:1px solid #263449;
  border-radius:20px;
  padding:22px;
  position:relative;
}
.close{
  position:absolute;
  right:15px;
  top:13px;
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:#17243a;
  color:white;
  font-size:20px;
}
.modal h2{margin-bottom:18px}
.product-detail{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}
.product-detail-image{
  width:100%;
  height:420px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:18px;
  background:#111827;
}
.product-detail-image img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  max-width:100%;
  max-height:100%;
}
.detail-info h1{
  font-size:30px;
  line-height:1.15;
  margin-bottom:10px;
}
.detail-info .price{font-size:30px}
.detail-info p{
  color:#94a3b8;
  line-height:1.6;
  margin:15px 0;
}
.form{
  display:grid;
  gap:12px;
}
.form input{
  width:100%;
  padding:13px;
  background:#07101d;
  border:1px solid #263449;
  border-radius:10px;
  color:white;
  outline:none;
}
.form input:focus{border-color:#3b82f6}
.cart-item{
  display:flex;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid var(--border);
}
.cart-item img{
  width:75px;
  height:75px;
  object-fit:contain;
  background:#111827;
  border-radius:10px;
}
.cart-info{flex:1}
.cart-info h3{font-size:15px}
.qty{
  display:flex;
  gap:7px;
  align-items:center;
  margin-top:9px;
}
.qty button{
  width:28px;
  height:28px;
  border:1px solid var(--border);
  background:#162236;
  color:white;
  border-radius:6px;
}
.cart-total{
  display:flex;
  justify-content:space-between;
  font-size:21px;
  font-weight:900;
  margin-top:18px;
}
.payment-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}
.payment{
  background:#111c2d;
  border:1px solid #293950;
  color:white;
  border-radius:12px;
  padding:15px;
}
.payment.active{
  border-color:#3b82f6;
  background:#12284c;
}
.nova{
  margin-top:15px;
  padding:15px;
  background:linear-gradient(135deg,#301c00,#5b3500);
  border:1px solid #a16207;
  border-radius:13px;
}
.nova input{
  width:100%;
  margin-top:9px;
  padding:11px;
  background:#120d05;
  color:white;
  border:1px solid #a16207;
  border-radius:9px;
}
.account-box{
  display:grid;
  gap:12px;
}
.toast{
  position:fixed;
  bottom:22px;
  right:22px;
  background:#101b2d;
  border:1px solid #30415a;
  color:white;
  padding:14px 18px;
  border-radius:12px;
  z-index:500;
  transform:translateY(100px);
  opacity:0;
  transition:.25s;
}
.toast.show{
  transform:translateY(0);
  opacity:1;
}
footer{
  margin-top:50px;
  padding:35px 20px;
  border-top:1px solid var(--border);
  text-align:center;
  color:#64748b;
}
@media(max-width:1050px){
  .products{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:750px){
  .products{grid-template-columns:repeat(2,1fr)}
  .product-detail{grid-template-columns:1fr}
  .payment-grid{grid-template-columns:1fr}
  .hero-box{padding:30px 22px}
  .nav{flex-wrap:wrap}
  .search{order:5;flex-basis:100%}
}
@media(max-width:500px){
  .products{grid-template-columns:1fr}
}
</style>
</head>

<footer>

/* =========================================================
   ETAT
========================================================= */

let cart=JSON.parse(localStorage.getItem("novaCart")||"[]");
let favorites=JSON.parse(localStorage.getItem("novaFavorites")||"[]");

let currentCategory="Tous";
let currentSort="default";
let searchText="";
let currentProduct=null;
let nova100Active=false;
let selectedPayment="card";

/* =========================================================
   OUTILS
========================================================= */

const $=id=>document.getElementById(id);

function money(n){
  return Number(n).toFixed(2).replace(".",",")+" €";
}

function save(){
  localStorage.setItem("novaCart",JSON.stringify(cart));
  localStorage.setItem("novaFavorites",JSON.stringify(favorites));
}

function getProduct(id){
  return products.find(p=>p.id===id);
}

function toast(message){
  const t=$("toast");
  t.textContent=message;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}

function openModal(html){
  $("modalContent").innerHTML=html;
  $("overlay").classList.add("open");
}

function closeModal(){
  $("overlay").classList.remove("open");
}

function cartCount(){
  return cart.reduce((a,b)=>a+b.qty,0);
}

function cartTotal(){
  return cart.reduce((a,b)=>{
    const p=getProduct(b.id);
    return a+(p?p.price*b.qty:0);
  },0);
}

function updateBadge(){
  $("cartBadge").textContent=cartCount();
}

/* =========================================================
   CATEGORIES
========================================================= */

function renderCategories(){

  const cats=["Tous",...new Set(products.map(p=>p.category))];

  $("categories").innerHTML=cats.map(c=>`
    <button class="cat ${c===currentCategory?"active":""}" data-cat="${c}">
      ${c}
    </button>
  `).join("");

  document.querySelectorAll("[data-cat]").forEach(btn=>{
    btn.onclick=()=>{
      currentCategory=btn.dataset.cat;
      renderCategories();
      renderProducts();
    };
  });
}

/* =========================================================
   PRODUITS
========================================================= */

function filteredProducts(){

  let list=[...products];

  if(currentCategory!=="Tous"){
    list=list.filter(p=>p.category===currentCategory);
  }

  if(searchText.trim()){
    const q=searchText.toLowerCase();
    list=list.filter(p=>
      p.name.toLowerCase().includes(q) ||
      p.category.toLowerCase().includes(q)
    );
  }

  if(currentSort==="priceAsc"){
    list.sort((a,b)=>a.price-b.price);
  }

  if(currentSort==="priceDesc"){
    list.sort((a,b)=>b.price-a.price);
  }

  if(currentSort==="name"){
    list.sort((a,b)=>a.name.localeCompare(b.name));
  }

  return list;
}

function renderProducts(){

  const list=filteredProducts();

  if(!list.length){
    $("products").innerHTML=`
      <div class="empty">
        <h2>Aucun produit trouvé 😕</h2>
        <p>Essaie une autre recherche ou catégorie.</p>
      </div>
    `;
    return;
  }

  $("products").innerHTML=list.map(p=>`

    <article class="card">

      <div class="card-img">
        <img
          src="${p.image}"
          alt="${p.name.replace(/"/g,"&quot;")}"
          referrerpolicy="no-referrer"
          onerror="this.onerror=null;this.src='https://placehold.co/800x800/111827/ffffff?text=NovaShop'"
        >
      </div>

      <div class="card-body">

        ${p.new?`<span class="badge">NOUVEAU</span>`:""}

        <h3>${p.name}</h3>

        <div class="category">${p.category}</div>

        <div class="price">${money(p.price)}</div>

        <div class="card-actions">

          <button class="buy" data-open="${p.id}">
            Voir
          </button>

          <button class="fav ${favorites.includes(p.id)?"active":""}"
                  data-fav="${p.id}">
            ${favorites.includes(p.id)?"♥":"♡"}
          </button>

        </div>

      </div>
    </article>
  `).join("");

  document.querySelectorAll("[data-open]").forEach(btn=>{
    btn.onclick=()=>openProduct(btn.dataset.open);
  });

  document.querySelectorAll("[data-fav]").forEach(btn=>{
    btn.onclick=()=>{
      toggleFavorite(btn.dataset.fav);
    };
  });
}

function openProduct(id){

  const p=getProduct(id);
  if(!p)return;

  currentProduct=id;

  openModal(`
    <div class="product-detail">

      <div class="product-detail-image">
        <img
          src="${p.image}"
          alt="${p.name.replace(/"/g,"&quot;")}"
          referrerpolicy="no-referrer"
          onerror="this.onerror=null;this.src='https://placehold.co/800x800/111827/ffffff?text=NovaShop'"
        >
      </div>

      <div class="detail-info">

        ${p.new?`<span class="badge">NOUVEAU</span>`:""}

        <h1>${p.name}</h1>

        <div class="category">${p.category}</div>

        <div class="price">${money(p.price)}</div>

        <p>
          Produit disponible sur NovaShop.
          Ajoute-le au panier pour continuer ta commande.
        </p>

        <button class="primary" id="detailAdd">
          🛒 Ajouter au panier
        </button>

        <button class="secondary" id="detailFav" style="margin-top:10px;width:100%">
          ${favorites.includes(p.id)?"♥ Retirer des favoris":"♡ Ajouter aux favoris"}
        </button>

      </div>

    </div>
  `);

  $("detailAdd").onclick=()=>{
    addToCart(p.id);
    closeModal();
  };

  $("detailFav").onclick=()=>{
    toggleFavorite(p.id);
    openProduct(p.id);
  };
}

/* =========================================================
   PANIER
========================================================= */

function addToCart(id){

  const item=cart.find(x=>x.id===id);

  if(item){
    item.qty++;
  }else{
    cart.push({id,qty:1});
  }

  save();
  updateBadge();
  toast("Produit ajouté au panier 🛒");
}

function removeFromCart(id){

  cart=cart.filter(x=>x.id!==id);

  save();
  updateBadge();
  renderCart();
}

function changeQty(id,delta){

  const item=cart.find(x=>x.id===id);

  if(!item)return;

  item.qty+=delta;

  if(item.qty<=0){
    removeFromCart(id);
    return;
  }

  save();
  updateBadge();
  renderCart();
}

function renderCart(){

  if(!cart.length){

    openModal(`
      <h2>🛒 Ton panier</h2>

      <div class="empty">
        <h3>Ton panier est vide</h3>
        <p>Ajoute des produits pour les retrouver ici.</p>
      </div>
    `);

    return;
  }

  let html=`
    <h2>🛒 Ton panier</h2>
  `;

  cart.forEach(item=>{

    const p=getProduct(item.id);
    if(!p)return;

    html+=`
      <div class="cart-item">

        <img
          src="${p.image}"
          alt=""
          referrerpolicy="no-referrer"
          onerror="this.onerror=null;this.src='https://placehold.co/300x300/111827/ffffff?text=NovaShop'"
        >

        <div class="cart-info">

          <h3>${p.name}</h3>

          <div class="category">${money(p.price)} / unité</div>

          <div class="qty">

            <button data-minus="${p.id}">−</button>

            <b>${item.qty}</b>

            <button data-plus="${p.id}">+</button>

            <button data-remove="${p.id}" style="margin-left:8px">
              🗑️
            </button>

          </div>

        </div>

      </div>
    `;
  });

  const total=cartTotal();

  html+=`
    <div class="cart-total">
      <span>Total</span>
      <span>${money(total)}</span>
    </div>

    <button class="primary" id="checkoutBtn"
            style="width:100%;margin-top:18px">
      💳 Passer au paiement
    </button>
  `;

  openModal(html);

  document.querySelectorAll("[data-minus]").forEach(b=>{
    b.onclick=()=>changeQty(b.dataset.minus,-1);
  });

  document.querySelectorAll("[data-plus]").forEach(b=>{
    b.onclick=()=>changeQty(b.dataset.plus,1);
  });

  document.querySelectorAll("[data-remove]").forEach(b=>{
    b.onclick=()=>removeFromCart(b.dataset.remove);
  });

  $("checkoutBtn").onclick=renderCheckout;
}

/* =========================================================
   FAVORIS
========================================================= */

function toggleFavorite(id){

  if(favorites.includes(id)){
    favorites=favorites.filter(x=>x!==id);
    toast("Retiré des favoris");
  }else{
    favorites.push(id);
    toast("Ajouté aux favoris ❤️");
  }

  save();
  renderProducts();
}

function renderFavorites(){

  const list=products.filter(p=>favorites.includes(p.id));

  openModal(`
    <h2>❤️ Mes favoris</h2>

    ${
      list.length
      ? `<div class="products" id="favoriteProducts"></div>`
      : `<div class="empty">
           <h3>Aucun favori</h3>
           <p>Ajoute des produits avec le bouton ♡.</p>
         </div>`
    }
  `);

  if(!list.length)return;

  const box=$("favoriteProducts");

  box.innerHTML=list.map(p=>`
    <article class="card">

      <div class="card-img">
        <img src="${p.image}"
             referrerpolicy="no-referrer"
             onerror="this.onerror=null;this.src='https://placehold.co/800x800/111827/ffffff?text=NovaShop'">
      </div>

      <div class="card-body">
        <h3>${p.name}</h3>
        <div class="category">${p.category}</div>
        <div class="price">${money(p.price)}</div>
        <button class="primary" data-favorite-open="${p.id}"
                style="width:100%;margin-top:12px">
          Voir
        </button>
      </div>

    </article>
  `).join("");

  document.querySelectorAll("[data-favorite-open]").forEach(b=>{
    b.onclick=()=>openProduct(b.dataset.favoriteOpen);
  });
}

/* =========================================================
   NOVA100
========================================================= */

function novaTotal(){

  let total=cartTotal();

  if(nova100Active){
    total*=0.9;
  }

  return total;
}

function activateNova(){

  const input=$("novaCode");

  if(!input)return;

  if(input.value.trim().toUpperCase()==="NOVA100"){

    nova100Active=true;

    toast("NOVA100 activé ⭐ -10%");

    renderCheckout();

  }else{
    toast("Code NOVA100 incorrect");
  }
}

/* =========================================================
   CHECKOUT
========================================================= */

function renderCheckout(){

  if(!cart.length){
    renderCart();
    return;
  }

  const total=cartTotal();
  const finalTotal=novaTotal();

  openModal(`
    <h2>💳 Paiement</h2>

    <div class="nova">

      <b>⭐ Code NOVA100</b>

      <input id="novaCode"
             placeholder="Entre NOVA100"
             value="${nova100Active?"NOVA100":""}">

      <button class="secondary"
              id="activateNova"
              style="margin-top:9px;width:100%">
        Activer
      </button>

    </div>

    <div style="margin-top:18px">

      <p style="color:#94a3b8">
        Total avant réduction :
        <b>${money(total)}</b>
      </p>

      ${
        nova100Active
        ? `<p style="color:#22c55e;margin-top:7px">
             Réduction NOVA100 : -10%
           </p>`
        :""
      }

      <h2 style="margin-top:10px">
        Total : ${money(finalTotal)}
      </h2>

    </div>

    <div class="payment-grid">

      <button class="payment ${selectedPayment==="card"?"active":""}"
              data-payment="card">
        💳 Carte bancaire
      </button>

      <button class="payment ${selectedPayment==="paypal"?"active":""}"
              data-payment="paypal">
        🅿️ PayPal
      </button>

      <button class="payment ${selectedPayment==="transfer"?"active":""}"
              data-payment="transfer">
        🏦 Virement
      </button>

    </div>

    <div class="form" style="margin-top:18px">

      <input id="customerName" placeholder="Nom">

      <input id="customerEmail" type="email"
             placeholder="Email">

      <button class="primary" id="confirmOrder">
        Confirmer la commande
      </button>

    </div>

    <p style="font-size:12px;color:#64748b;margin-top:14px">
      Le bouton enregistre la commande. Il ne débite pas réellement
      une carte ou un compte PayPal.
    </p>
  `);

  $("activateNova").onclick=activateNova;

  document.querySelectorAll("[data-payment]").forEach(btn=>{
    btn.onclick=()=>{
      selectedPayment=btn.dataset.payment;
      renderCheckout();
    };
  });

  $("confirmOrder").onclick=createOrder;
}

/* =========================================================
   COMMANDE
========================================================= */

function createOrder(){

  const name=$("customerName").value.trim();
  const email=$("customerEmail").value.trim();

  if(!name||!email){
    toast("Remplis ton nom et ton email");
    return;
  }

  const order={
    id:"NOVA-"+Date.now(),
    customerName:name,
    customerEmail:email,
    payment:selectedPayment,
    nova100:nova100Active,
    total:novaTotal(),
    items:cart.map(x=>({
      id:x.id,
      qty:x.qty
    })),
    createdAt:new Date().toISOString()
  };

  const orders=JSON.parse(localStorage.getItem("novaOrders")||"[]");

  orders.push(order);

  localStorage.setItem("novaOrders",JSON.stringify(orders));

  cart=[];
  nova100Active=false;

  save();
  updateBadge();

  openModal(`
    <div style="text-align:center;padding:25px">

      <div style="font-size:55px">✅</div>

      <h2>Commande enregistrée !</h2>

      <p style="color:#94a3b8;margin:12px 0">
        Numéro de commande :
      </p>

      <b>${order.id}</b>

      <p style="color:#94a3b8;margin-top:15px">
        Paiement sélectionné :
        ${selectedPayment}
      </p>

      <button class="primary"
              id="backShop"
              style="margin-top:20px">
        Retour à la boutique
      </button>

    </div>
  `);

  $("backShop").onclick=()=>{
    closeModal();
    window.scrollTo({top:0,behavior:"smooth"});
  };

  toast("Commande enregistrée ✅");
}

/* =========================================================
   COMPTE
========================================================= */

function renderAccount(){

  const orders=JSON.parse(localStorage.getItem("novaOrders")||"[]");

  openModal(`
    <h2>👤 Mon compte</h2>

    <div class="account-box">

      <div style="
        padding:16px;
        background:#111c2d;
        border-radius:12px;
      ">
        <b>Compte NovaShop</b>
        <p style="color:#94a3b8;margin-top:7px">
          Les commandes sont conservées sur cet appareil.
        </p>
      </div>

      <button class="secondary" id="ordersBtn">
        📦 Mes commandes (${orders.length})
      </button>

      <button class="secondary" id="clearOrders">
        🗑️ Effacer les commandes locales
      </button>

    </div>
  `);

  $("ordersBtn").onclick=renderOrders;

  $("clearOrders").onclick=()=>{
    localStorage.removeItem("novaOrders");
    toast("Commandes supprimées");
    renderAccount();
  };
}

function renderOrders(){

  const orders=JSON.parse(localStorage.getItem("novaOrders")||"[]");

  if(!orders.length){

    openModal(`
      <h2>📦 Mes commandes</h2>

      <div class="empty">
        <h3>Aucune commande</h3>
      </div>
    `);

    return;
  }

  openModal(`
    <h2>📦 Mes commandes</h2>

    ${orders.slice().reverse().map(o=>`
      <div style="
        padding:15px;
        border:1px solid #1e293b;
        border-radius:12px;
        margin-bottom:10px;
      ">

        <b>${o.id}</b>

        <p style="color:#94a3b8;margin-top:7px">
          ${o.customerName}
        </p>

        <p style="margin-top:6px">
          ${money(o.total)}
        </p>

        <p style="color:#64748b;font-size:12px;margin-top:5px">
          Paiement : ${o.payment}
        </p>

      </div>
    `).join("")}
  `);
}

/* =========================================================
   BOUTONS
========================================================= */

$("closeModal").onclick=closeModal;

$("overlay").addEventListener("click",e=>{
  if(e.target===$("overlay"))closeModal();
});

$("cartBtn").onclick=renderCart;

$("favoritesBtn").onclick=renderFavorites;

$("accountBtn").onclick=renderAccount;

$("shopBtn").onclick=()=>{
  $("shop").scrollIntoView({
    behavior:"smooth"
  });
};

$("novaBtn").onclick=()=>{
  $("shop").scrollIntoView({
    behavior:"smooth"
  });

  setTimeout(()=>{
    toast("Entre NOVA100 au paiement pour obtenir -10% ⭐");
  },500);
};

$("search").addEventListener("input",e=>{
  searchText=e.target.value;
  renderProducts();
});

$("sort").addEventListener("change",e=>{
  currentSort=e.target.value;
  renderProducts();
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeModal();
});

/* =========================================================
   INIT
========================================================= */

renderCategories();
renderProducts();
updateBadge();

console.log("NovaShop chargé :",products.length,"produits");
console.log("Boutons NovaShop actifs ✅");
</script>
