<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050912">
<title>NovaShop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050912;
  --bg2:#09111f;
  --card:#0c1525;
  --card2:#101c30;
  --border:#1c2b43;
  --text:#f5f7fb;
  --muted:#8e9bb0;
  --blue:#3478ff;
  --blue2:#5d96ff;
  --green:#23d17b;
  --red:#ff4f67;
  --yellow:#ffd34d;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top right,#102858 0,transparent 35%),
    radial-gradient(circle at top left,#0d1830 0,transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(5,9,18,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.nav{
  max-width:1400px;
  margin:auto;
  min-height:72px;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
  white-space:nowrap;
}

.logo span{
  color:var(--blue2);
}

.search{
  flex:1;
  max-width:650px;
  position:relative;
}

.search input{
  width:100%;
  height:44px;
  padding:0 16px;
  border-radius:13px;
  border:1px solid var(--border);
  outline:none;
  color:white;
  background:#0a1322;
}

.search input:focus{
  border-color:var(--blue);
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  min-width:43px;
  height:43px;
  padding:0 11px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#0a1322;
  color:white;
}

.icon-btn:hover{
  border-color:#315a9c;
  background:#101d31;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:19px;
  height:19px;
  padding:0 5px;
  border-radius:20px;
  background:var(--blue);
  font-size:11px;
  margin-left:3px;
}

.hero{
  max-width:1400px;
  margin:28px auto 0;
  padding:35px 25px;
}

.hero-box{
  padding:55px;
  border:1px solid var(--border);
  border-radius:25px;
  background:
    linear-gradient(135deg,rgba(29,82,180,.30),rgba(8,17,31,.85)),
    #0a1424;
  overflow:hidden;
  position:relative;
}

.hero-box:after{
  content:"";
  position:absolute;
  width:330px;
  height:330px;
  border-radius:50%;
  right:-100px;
  top:-140px;
  background:rgba(61,127,255,.18);
  filter:blur(5px);
}

.hero h1{
  position:relative;
  z-index:1;
  font-size:clamp(38px,6vw,72px);
  line-height:.95;
  margin-bottom:20px;
}

.hero h1 span{
  color:var(--blue2);
}

.hero p{
  position:relative;
  z-index:1;
  max-width:650px;
  color:var(--muted);
  font-size:17px;
  line-height:1.6;
}

.hero-buttons{
  position:relative;
  z-index:1;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:25px;
}

.primary,
.secondary,
.danger{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  color:white;
  font-weight:800;
}

.primary{
  background:linear-gradient(135deg,var(--blue),#2059d9);
}

.secondary{
  background:#121f33;
  border:1px solid var(--border);
}

.danger{
  background:#471723;
  color:#ff9bab;
}

.primary:hover{
  filter:brightness(1.12);
}

.secondary:hover{
  background:#182943;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:0 25px 60px;
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
  margin:10px 0 25px;
}

.categories{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:5px;
}

.category{
  white-space:nowrap;
  border:1px solid var(--border);
  background:#0b1423;
  color:#b9c4d5;
  border-radius:999px;
  padding:9px 14px;
}

.category.active,
.category:hover{
  color:white;
  background:#17346b;
  border-color:#3269c7;
}

.sort{
  background:#0b1423;
  color:white;
  border:1px solid var(--border);
  padding:10px 13px;
  border-radius:11px;
  outline:none;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px;
}

.product-card{
  position:relative;
  border:1px solid var(--border);
  background:linear-gradient(180deg,#0d1727,#09111e);
  border-radius:18px;
  overflow:hidden;
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-3px);
  border-color:#294d82;
}

.product-image{
  width:100%;
  height:230px;
  object-fit:contain;
  background:#fff;
  padding:12px;
}

.product-content{
  padding:15px;
}

.product-category{
  font-size:12px;
  color:var(--blue2);
  margin-bottom:7px;
}

.product-name{
  min-height:48px;
  font-size:16px;
  line-height:1.4;
  font-weight:800;
}

.product-price{
  font-size:21px;
  font-weight:900;
  margin:13px 0;
}

.product-actions{
  display:flex;
  gap:8px;
}

.product-actions button{
  flex:1;
}

.favorite{
  position:absolute;
  right:12px;
  top:12px;
  z-index:2;
  width:39px;
  height:39px;
  border:1px solid #243650;
  border-radius:50%;
  background:rgba(4,9,17,.85);
  color:white;
}

.favorite.active{
  color:#ff5470;
}

.new-tag{
  position:absolute;
  left:12px;
  top:12px;
  background:var(--green);
  color:#00170c;
  font-size:11px;
  font-weight:900;
  padding:6px 9px;
  border-radius:7px;
  z-index:2;
}

.empty{
  border:1px dashed #263955;
  border-radius:18px;
  padding:45px;
  text-align:center;
  color:var(--muted);
  grid-column:1/-1;
}

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:500;
  padding:18px;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:min(900px,100%);
  max-height:92vh;
  overflow:auto;
  background:#091321;
  border:1px solid var(--border);
  border-radius:22px;
  padding:25px;
  position:relative;
}

.close{
  position:absolute;
  right:15px;
  top:15px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid var(--border);
  background:#111d30;
  color:white;
}

.detail{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

.detail img{
  width:100%;
  height:430px;
  object-fit:contain;
  background:white;
  border-radius:15px;
}

.detail h2{
  font-size:30px;
  margin-bottom:10px;
}

.detail-price{
  font-size:28px;
  font-weight:900;
  margin:20px 0;
}

.cart-item{
  display:flex;
  gap:14px;
  align-items:center;
  border-bottom:1px solid var(--border);
  padding:15px 0;
}

.cart-item img{
  width:75px;
  height:75px;
  object-fit:contain;
  background:white;
  border-radius:10px;
}

.cart-info{
  flex:1;
}

.cart-name{
  font-weight:800;
  margin-bottom:6px;
}

.qty{
  display:flex;
  gap:6px;
  align-items:center;
}

.qty button{
  width:30px;
  height:30px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#101d31;
  color:white;
}

.total-box{
  margin-top:20px;
  padding:18px;
  border-radius:14px;
  background:#0e1a2c;
  border:1px solid var(--border);
}

.total-line{
  display:flex;
  justify-content:space-between;
  font-size:22px;
  font-weight:900;
}

.form{
  display:grid;
  gap:12px;
}

.form input{
  width:100%;
  height:45px;
  background:#07101d;
  border:1px solid var(--border);
  border-radius:10px;
  padding:0 13px;
  color:white;
  outline:none;
}

.form input:focus{
  border-color:var(--blue);
}

.payment-choice{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:15px 0;
}

.payment-btn{
  padding:15px;
  border-radius:12px;
  background:#0c1727;
  color:white;
  border:1px solid var(--border);
  font-weight:800;
}

.payment-btn.active{
  border-color:var(--blue);
  background:#132d5d;
}

.paypal-box,
.card-box{
  padding:15px;
  border:1px solid var(--border);
  background:#0b1626;
  border-radius:13px;
  margin-bottom:14px;
}

.card-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.error{
  background:#3a1420;
  color:#ff9bab;
  border:1px solid #7b2b3c;
  border-radius:10px;
  padding:12px;
}

.success{
  color:var(--green);
  font-weight:800;
}

.account-box{
  display:grid;
  gap:12px;
}

.admin-table{
  width:100%;
  border-collapse:collapse;
  min-width:750px;
}

.admin-wrap{
  overflow:auto;
}

.admin-table th,
.admin-table td{
  text-align:left;
  padding:13px;
  border-bottom:1px solid var(--border);
}

.admin-table th{
  color:#8ea2c2;
  font-size:13px;
}

.status{
  display:inline-block;
  padding:6px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:900;
}

.status.paid{
  background:#103c29;
  color:#48e69a;
}

.status.pending{
  background:#3c3110;
  color:#ffd96b;
}

.small-btn{
  border:1px solid var(--border);
  background:#12233b;
  color:white;
  padding:7px 10px;
  border-radius:8px;
}

.toast{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  z-index:1000;
  background:#142238;
  border:1px solid #294362;
  color:white;
  padding:13px 18px;
  border-radius:12px;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.section-title{
  margin-bottom:18px;
  font-size:25px;
}

.order-card{
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
  margin-bottom:10px;
  background:#0c1727;
}

@media(max-width:1050px){
  .products-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:750px){

  .nav{
    flex-wrap:wrap;
  }

  .logo{
    width:100%;
  }

  .search{
    order:3;
    max-width:none;
    width:100%;
  }

  .hero-box{
    padding:30px 22px;
  }

  .products-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .detail{
    grid-template-columns:1fr;
  }

  .detail img{
    height:300px;
  }

  .card-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:480px){

  .products-grid{
    grid-template-columns:1fr;
  }

  .nav-actions{
    width:100%;
    justify-content:space-between;
  }

  .icon-btn{
    flex:1;
  }

  .hero{
    padding:20px 14px;
  }

  .container{
    padding:0 14px 40px;
  }

  .cart-item{
    align-items:flex-start;
  }

}
</style>
</head>

<body>

<header>

  <div class="nav">

    <div class="logo">
      NOVA<span>SHOP</span>
    </div>

    <div class="search">

      <input
        id="searchInput"
        type="search"
        placeholder="Rechercher un produit..."
        autocomplete="off"
      >

    </div>

    <div class="nav-actions">

      <button
        class="icon-btn"
        id="accountBtn"
      >
        👤
      </button>

      <button
        class="icon-btn"
        id="favoritesBtn"
      >
        ❤️
        <span
          class="badge"
          id="favoritesCount"
        >
          0
        </span>
      </button>

      <button
        class="icon-btn"
        id="dashboardBtn"
      >
        👑
      </button>

      <button
        class="icon-btn"
        id="cartBtn"
      >
        🛒
        <span
          class="badge"
          id="cartCount"
        >
          0
        </span>
      </button>

    </div>

  </div>

</header>


<main>

  <section class="hero">

    <div class="hero-box">

      <h1>
        NOVA<span>SHOP</span>
      </h1>

      <p>
        Composants PC, périphériques, écrans, bureaux et équipements gaming.
        Tout ton setup au même endroit.
      </p>

      <div class="hero-buttons">

        <button
          class="primary"
          id="productsBtn"
        >
          Voir les produits
        </button>

        <button
          class="secondary"
          id="heroDashboardBtn"
        >
          Dashboard
        </button>

      </div>

    </div>

  </section>


  <section class="container">

    <div class="toolbar">

      <div
        class="categories"
        id="categories"
      ></div>

      <select
        class="sort"
        id="sortSelect"
      >

        <option value="default">
          Trier
        </option>

        <option value="priceAsc">
          Prix croissant
        </option>

        <option value="priceDesc">
          Prix décroissant
        </option>

        <option value="name">
          Nom A-Z
        </option>

        <option value="new">
          Nouveautés
        </option>

      </select>

    </div>


    <div
      class="products-grid"
      id="productsGrid"
    ></div>

  </section>

</main>


<div
  class="modal-overlay"
  id="modalOverlay"
>

  <div class="modal">

    <button
      class="close"
      id="closeModal"
    >
      ✕
    </button>

    <div
      id="modalContent"
    ></div>

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script
  type="module"
  src="./app.js"
></script>

</body>
</html>
